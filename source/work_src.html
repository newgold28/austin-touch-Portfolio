<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Work — %%NAME%%, Graphic Designer</title>
<meta name="description" content="Flyers, party & event designs, logos and social media work by %%NAME%%."/>
<style>
@font-face{font-family:"Bebas Neue";src:url(data:font/woff2;base64,%%BEBAS%%) format("woff2");font-display:swap}
@font-face{font-family:"Montserrat";font-weight:500;src:url(data:font/woff2;base64,%%M500%%) format("woff2");font-display:swap}
@font-face{font-family:"Montserrat";font-weight:700;src:url(data:font/woff2;base64,%%M700%%) format("woff2");font-display:swap}
:root{--black:#000;--white:#fff;--blue:#2251ff;--blueL:#7f9bff;--mut:#9a9cab;--e-out:cubic-bezier(.22,1,.36,1);--e-inout:cubic-bezier(.45,0,.55,1);--e-sig:cubic-bezier(.34,1.56,.64,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font:500 15px/1.5 "Montserrat",sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
.disp{font-family:"Bebas Neue";font-weight:400;line-height:.86}
/* top bar (goes solid on scroll, like a streaming app) */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:22px;padding:18px 5vw;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);transition:background .4s}
.bar.solid{background:#000}
.mark{font:400 34px/1 "Bebas Neue";letter-spacing:.04em}.mark b{color:var(--blue);font-weight:400}
.bar nav{display:flex;gap:18px;font-size:13.5px;font-weight:700;color:#d6d8e2}
.bar nav a{transition:color .3s}.bar nav a:hover,.bar nav a.on{color:#fff}
.bar .sp{flex:1}
.pill{padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px;background:var(--blue);transition:background .3s}
.pill:hover{background:#3a63ff}
/* billboard */
.bill{position:relative;height:86vh;min-height:520px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--e-inout)}
.slide.on{opacity:1}
.slide::before{content:"";position:absolute;inset:-60px;background:var(--im) center/cover;filter:blur(40px) brightness(.5) saturate(1.3);scale:1.1}
.slide img{position:absolute;right:8vw;top:52%;height:72%;max-width:38vw;object-fit:contain;translate:0 -50%;border-radius:12px;box-shadow:0 40px 90px -20px rgba(0,0,0,.95);transform:perspective(1200px) rotateY(-14deg) scale(.95);transition:transform 6.5s linear}
.slide.on img{transform:perspective(1200px) rotateY(-5deg) scale(1)}
.bill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.5) 42%,transparent 72%),linear-gradient(0deg,#000,transparent 34%);pointer-events:none}
.btxt{position:absolute;z-index:2;left:5vw;bottom:24vh;max-width:560px}
.series{font-size:12px;font-weight:700;letter-spacing:.3em;display:flex;align-items:center;gap:10px;color:#e6e8f0}
.series b{font:400 34px/1 "Bebas Neue";color:var(--blue)}
.btxt h1{font-size:clamp(70px,9vw,150px);margin:10px 0 8px;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.btxt p{color:#d9dbe4}
.bbtns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.bbtns button,.bbtns a{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:8px;border:0;font-weight:700;font-size:15px;transition:background .3s,scale .3s var(--e-out)}
.bbtns .play{background:#fff;color:#000}.bbtns .play:hover{background:#d8dcff;scale:1.04}
.bbtns .info{background:rgba(120,125,140,.45);color:#fff;backdrop-filter:blur(6px)}.bbtns .info:hover{background:rgba(120,125,140,.7)}
.dots{position:absolute;z-index:2;left:5vw;bottom:16vh;display:flex;gap:6px}
.dots button{width:26px;height:4px;border:0;border-radius:2px;background:rgba(255,255,255,.3);padding:0}
.dots button.on{background:#fff}
/* genre chips */
.chips{position:sticky;top:70px;z-index:40;display:flex;gap:8px;padding:12px 5vw;margin-top:-12vh;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.solid{background:#000;box-shadow:0 10px 20px -10px #000}
.chips{transition:background .3s}
.chips button{flex:none;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;transition:background .3s,border-color .3s,color .3s}
.chips button:hover{border-color:#fff}
.chips button.on{background:#fff;color:#000;border-color:#fff}
.chips button i{font-style:normal;opacity:.55;margin-left:6px}
.brandtag{display:none;flex:none;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--blue);font-size:13px;font-weight:700}
.brandtag.on{display:inline-flex}
/* rows */
.rows{position:relative;z-index:3;padding-top:14px;min-height:40vh}
.nrow{margin-bottom:34px}
.nrow h3{padding:0 5vw;font-size:19px;font-weight:700;margin-bottom:10px}
.track{display:flex;gap:8px;padding:30px 5vw 40px;margin:-30px 0 -40px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.nc{flex:0 0 auto;width:clamp(150px,15vw,230px);aspect-ratio:2/3;border-radius:6px;overflow:hidden;position:relative;background:#111;border:0;padding:0;transition:scale .4s var(--e-out),box-shadow .4s;text-align:left}
.nc img{width:100%;height:100%;object-fit:cover;display:block}
.nc .ov{position:absolute;inset:auto 0 0 0;padding:30px 12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent);opacity:0;transition:opacity .3s}
.nc .ov b{display:block;font-size:13px}.nc .ov small{font-size:11px;color:#b9bccb}
.nc:hover{scale:1.28;z-index:5;box-shadow:0 20px 50px rgba(0,0,0,.85)}
.nc:hover .ov{opacity:1}
.top10 .nc{width:clamp(220px,22vw,320px);aspect-ratio:auto;height:clamp(190px,19vw,270px);overflow:visible;background:transparent;display:flex;align-items:flex-end}
.top10 .nc .num{font:400 clamp(170px,17vw,250px)/.72 "Bebas Neue";color:#000;-webkit-text-stroke:3px #4d4f5c;margin-right:-22px;letter-spacing:-.04em}
.top10 .nc .pst{position:relative;z-index:1;height:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden}
.top10 .nc .pst img{width:100%;height:100%;object-fit:cover}
.top10 .nc:hover{scale:1.1}
.tk{flex:0 0 auto;width:clamp(150px,15vw,230px);aspect-ratio:9/16;border-radius:10px;overflow:hidden;position:relative;background:#111;transition:scale .4s var(--e-out),box-shadow .4s;display:block}
.tk video,.tk .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tk .bg{background:var(--im) center/cover;filter:blur(14px) brightness(.45);scale:1.15}
.tk .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.tk .h{font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.tk .h i{width:26px;height:26px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-style:normal;font:400 16px/1 "Bebas Neue"}
.tk .pl{align-self:center;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:20px;transition:scale .4s var(--e-sig),background .3s}
.tk b{font:400 26px/1 "Bebas Neue";letter-spacing:.02em}
.tk small{display:block;font-size:11px;color:#c9cbd6;margin-top:4px}
.tk:hover{scale:1.08;z-index:5;box-shadow:0 20px 50px rgba(0,0,0,.85)}
.tk:hover .pl{scale:1.12;background:var(--blue)}
.gridwrap{padding:0 5vw}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.grid .nc{width:auto}
.ghead{padding:0 5vw 16px;font:400 clamp(44px,5vw,80px)/.9 "Bebas Neue"}
.ghead em{font-style:normal;color:var(--blue)}
/* viewer */
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);backdrop-filter:blur(16px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;padding:20px}
.lb.on{opacity:1;visibility:visible}
.lbc{width:min(920px,100%);max-height:94vh;overflow:auto;background:#141414;border-radius:12px;display:grid;grid-template-columns:1.1fr 1fr;box-shadow:0 40px 100px rgba(0,0,0,.8);scale:.94;transition:scale .4s var(--e-sig)}
.lb.on .lbc{scale:1}
.lbc img{width:100%;height:100%;max-height:86vh;object-fit:contain;background:#0a0a0a;border-radius:12px 0 0 12px}
.lbs{padding:34px 28px;display:flex;flex-direction:column;gap:14px}
.lbs small{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--blueL)}
.lbs h2{font:400 52px/.9 "Bebas Neue"}
.lbs .b{color:#c9cbd6}
.lbs .more{width:fit-content;font-weight:700;font-size:13px;border-bottom:1px solid var(--blue);background:none;border-top:0;border-left:0;border-right:0;padding:0 0 2px}
.lbs .row2{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.lbs .row2 button{border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:8px;padding:11px 16px;font-weight:700;font-size:13px}
.lbs .row2 button:hover{background:#fff;color:#000}
.lbs .wa{display:inline-flex;padding:13px 20px;border-radius:8px;background:var(--blue);font-weight:700;font-size:14px;width:fit-content}
.x{position:absolute;top:18px;right:18px;border:0;background:#fff;color:#000;border-radius:999px;width:40px;height:40px;font-weight:700}
footer{padding:40px 5vw;color:var(--mut);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08);margin-top:40px}
footer a{color:#fff;font-weight:700}
@media (max-width:820px){.bar nav{display:none}.bill{height:74vh}.slide img{right:50%;translate:50% -64%;height:50%;max-width:72vw}.btxt{bottom:18vh}.dots{display:none}.chips{top:66px;margin-top:-8vh}.nc{width:120px}.top10 .nc{width:190px;height:170px}.top10 .nc .num{font-size:150px}.lbc{grid-template-columns:1fr}.lbc img{border-radius:12px 12px 0 0;max-height:60vh}.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.slide,.slide img{transition:none}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <a class="mark" href="index.html" aria-label="%%NAME%% — home">%%NAMEU%%<b>.</b></a>
  <nav><a href="index.html">Home</a><a class="on" href="work.html">All work</a><a href="cv.html">CV</a><a href="contact.html">Contact</a></nav>
  <span class="sp"></span>
  <a class="pill" href="contact.html">Hire me</a>
  <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mmenu"><i></i><i></i></button>
</header>

<section class="bill" id="bill" aria-label="Featured designs">
  <div id="slides"></div>
  <div class="btxt">
    <div class="series"><b>A</b> ORIGINAL · DESIGN SERIES</div>
    <h1 class="disp" id="bT">—</h1>
    <p id="bS">—</p>
    <div class="bbtns"><button class="play" id="bPlay">▶ View</button><button class="info" id="bMore">ⓘ More from this brand</button></div>
  </div>
  <div class="dots" id="dots"></div>
</section>

<div class="chips" id="chips" role="tablist"></div>
<main class="rows" id="rows"></main>

<footer><span>© 2026 %%NAME%% · Graphic designer</span><a href="https://wa.me/2348025906665" target="_blank" rel="noopener">Want designs like these? Chat on WhatsApp →</a></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Design viewer">
  <div class="lbc"><img id="lbImg" alt=""/><div class="lbs"><small id="lbCat"></small><h2 id="lbT"></h2><div class="b" id="lbB"></div>
    <button class="more" id="lbMore">More from this brand →</button>
    <a class="wa" href="https://wa.me/2348025906665" target="_blank" rel="noopener">Want one like this? →</a>
    <div class="row2"><button id="lbPrev" aria-label="Previous design">← Prev</button><button id="lbNext" aria-label="Next design">Next →</button></div></div></div>
  <button class="x" id="lbX" aria-label="Close">✕</button>
</div>

<script>
const STILL=new URLSearchParams(location.search).has("still")||matchMedia("(prefers-reduced-motion: reduce)").matches;
const W=%%WORKS%%;
const CATS=[["all","All"],["flyer","Flyers"],["party","Party & events"],["logo","Logos"],["social","Social media"]];
const slug=n=>n.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ITEMS=W.map((w,i)=>({i,title:w[0],brand:w[1],tags:w[2],img:"img/w"+String(i+1).padStart(2,"0")+".webp"}));
const catName=t=>(CATS.find(c=>c[0]===t)||[0,""])[1];
const BRANDS=[...new Set(ITEMS.map(x=>x.brand))];
// his TikTok videos: drop MP4 files in vid/ and list them here, e.g. ["vid/v01.mp4","Making a rave flyer"]
const VIDEOS=%%VIDEOS%%;
const TT="https://www.tiktok.com/@_austins.touch";
function tiktokRow(){const vids=VIDEOS.map(([src,t])=>`<a class="tk" href="${TT}" target="_blank" rel="noopener"><video src="${src}" muted loop playsinline preload="metadata"></video><span class="in"><span class="h"><i>A</i>@_austins.touch</span><span></span><span><b>${esc(t)}</b><small>Watch on TikTok ↗</small></span></span></a>`).join("");
  const promo=[1,6,12].map((i,k)=>`<a class="tk" href="${TT}" target="_blank" rel="noopener"><span class="bg" style="--im:url('${ITEMS[i].img}')"></span><span class="in"><span class="h"><i>A</i>@_austins.touch</span><span class="pl">▶</span><span><b>${["Watch on TikTok","See more designs","Follow for new drops"][k]}</b><small>On TikTok ↗</small></span></span></a>`).join("");
  return `<section class="nrow"><h3>From TikTok</h3><div class="track">${vids||promo}</div></section>`;}
let view=ITEMS;

// bar goes solid when scrolling
const bar=document.getElementById("bar");addEventListener("scroll",()=>{bar.classList.toggle("solid",scrollY>60);const c=document.getElementById("chips");c.classList.toggle("solid",c.getBoundingClientRect().top<=parseFloat(getComputedStyle(c).top)+1);},{passive:true});

// ---- billboard ----
const FEAT=[6,4,0,5,11].map(i=>ITEMS[i]);
const slides=document.getElementById("slides"),dots=document.getElementById("dots");
slides.innerHTML=FEAT.map((x,k)=>`<div class="slide${k?"":" on"}" style="--im:url('${x.img}')"><img src="${x.img}" alt="${esc(x.title)}"/></div>`).join("");
dots.innerHTML=FEAT.map((x,k)=>`<button class="${k?"":"on"}" aria-label="Show ${esc(x.title)}"></button>`).join("");
let bI=0,bTimer;
function show(k){bI=k;slides.querySelectorAll(".slide").forEach((d,i)=>d.classList.toggle("on",i===k));dots.querySelectorAll("button").forEach((d,i)=>d.classList.toggle("on",i===k));
  const x=FEAT[k];document.getElementById("bT").textContent=x.brand;document.getElementById("bS").textContent=x.title+" · "+x.tags.map(catName).join(" · ");}
dots.querySelectorAll("button").forEach((b,i)=>b.addEventListener("click",()=>{show(i);restart();}));
function restart(){clearInterval(bTimer);if(!STILL)bTimer=setInterval(()=>show((bI+1)%FEAT.length),6500);}
show(0);restart();
document.getElementById("bPlay").addEventListener("click",()=>openLB(FEAT[bI].i));
document.getElementById("bMore").addEventListener("click",()=>{location.hash="brand-"+slug(FEAT[bI].brand);});

// ---- genre chips ----
const chips=document.getElementById("chips");
chips.innerHTML=CATS.map(([k,v])=>`<button role="tab" data-c="${k}">${v}<i>${k==="all"?ITEMS.length:ITEMS.filter(x=>x.tags.includes(k)).length}</i></button>`).join("")+`<span class="brandtag" id="brandtag"></span>`;
chips.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{if(location.hash)history.replaceState(null,"",location.pathname+location.search);render(b.dataset.c,null);}));

// ---- rows ----
const card=x=>`<button class="nc" data-i="${x.i}" aria-label="Open ${esc(x.title)}"><img loading="lazy" src="${x.img}" alt="${esc(x.title)} — ${esc(x.brand)}"/><span class="ov"><b>${esc(x.title)}</b><small>${esc(x.brand)}</small></span></button>`;
const row=(h,xs,cls="")=>xs.length?`<section class="nrow ${cls}"><h3>${esc(h)}</h3><div class="track">${cls==="top10"
  ?xs.map((x,i)=>`<button class="nc" data-i="${x.i}" aria-label="Open ${esc(x.title)}"><span class="num">${i+1}</span><span class="pst"><img loading="lazy" src="${x.img}" alt="${esc(x.title)}"/></span></button>`).join("")
  :xs.map(card).join("")}</div></section>`:"";
const rowsEl=document.getElementById("rows");
function render(c,brand){
  chips.querySelectorAll("button").forEach(b=>b.classList.toggle("on",!brand&&b.dataset.c===c));
  const bt=document.getElementById("brandtag");bt.classList.toggle("on",!!brand);bt.textContent=brand?brand:"";
  if(brand){view=ITEMS.filter(x=>x.brand===brand);rowsEl.innerHTML=`<h2 class="ghead">${esc(brand)}<em>.</em></h2><div class="gridwrap"><div class="grid">${view.map(card).join("")}</div></div>`+row("More brands",BRANDS.filter(b=>b!==brand).map(b=>ITEMS.find(x=>x.brand===b)));}
  else if(c==="all"){view=ITEMS;rowsEl.innerHTML=row("Trending now",ITEMS.slice().reverse())+row("Top 10 picks",[6,4,1,9,11,12,5,2,13,15].map(i=>ITEMS[i]),"top10")+tiktokRow()+
    row("Party & event flyers",ITEMS.filter(x=>x.tags.includes("party")))+row("Brand promos & flyers",ITEMS.filter(x=>x.tags.includes("flyer")))+row("Logos & identity",ITEMS.filter(x=>x.tags.includes("logo")))+row("Social media",ITEMS.filter(x=>x.tags.includes("social")));}
  else{view=ITEMS.filter(x=>x.tags.includes(c));rowsEl.innerHTML=`<h2 class="ghead">${esc(catName(c))}<em>.</em></h2><div class="gridwrap"><div class="grid">${view.map(card).join("")}</div></div>`;}
  rowsEl.querySelectorAll(".nc").forEach(b=>b.addEventListener("click",()=>openLB(+b.dataset.i)));
  rowsEl.querySelectorAll(".tk video").forEach(v=>{const p=v.closest(".tk");p.addEventListener("pointerenter",()=>v.play().catch(()=>{}));p.addEventListener("pointerleave",()=>v.pause());
    new IntersectionObserver(([e])=>{if(matchMedia("(hover: none)").matches){e.isIntersecting?v.play().catch(()=>{}):v.pause();}},{threshold:.6}).observe(v);});
}
// ---- viewer ----
const lb=document.getElementById("lb");let lbI=0,lbOn=false;
function openLB(i){lbI=i;const x=ITEMS[i];const im=document.getElementById("lbImg");im.src=x.img;im.alt=x.title+" — "+x.brand;
  document.getElementById("lbT").textContent=x.title;document.getElementById("lbB").textContent=x.brand;document.getElementById("lbCat").textContent=x.tags.map(catName).join(" · ");
  document.getElementById("lbMore").style.display=ITEMS.filter(y=>y.brand===x.brand).length>1?"":"none";lb.classList.add("on");lbOn=true;document.getElementById("lbX").focus();}
function closeLB(){lb.classList.remove("on");lbOn=false;}
function step(d){const ids=view.map(x=>x.i);let p=ids.indexOf(lbI);if(p<0)p=0;openLB(ids[(p+d+ids.length)%ids.length]);}
document.getElementById("lbX").addEventListener("click",closeLB);document.getElementById("lbPrev").addEventListener("click",()=>step(-1));document.getElementById("lbNext").addEventListener("click",()=>step(1));
document.getElementById("lbMore").addEventListener("click",()=>{closeLB();location.hash="brand-"+slug(ITEMS[lbI].brand);});
lb.addEventListener("click",e=>{if(e.target===lb)closeLB();});
addEventListener("keydown",e=>{if(!lbOn)return;if(e.key==="Escape")closeLB();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1);});
// ---- routes: work.html?c=logo  /  work.html#brand-d-gadgets ----
function route(){const h=decodeURIComponent(location.hash.slice(1));const b=h.startsWith("brand-")?BRANDS.find(n=>"brand-"+slug(n)===h):null;
  render(b?"all":(new URLSearchParams(location.search).get("c")||"all"),b||null);if(b)document.getElementById("chips").scrollIntoView({behavior:"smooth"});}
addEventListener("hashchange",route);route();
</script>
%%MENU%%
</body>
</html>
