<style>
.burger{display:none;position:relative;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(12,12,18,.7);backdrop-filter:blur(12px);cursor:pointer;flex:none;z-index:95}
.burger i{position:absolute;left:13px;right:13px;height:2px;border-radius:2px;background:#fff;transition:transform .45s cubic-bezier(.22,1,.36,1),top .45s cubic-bezier(.22,1,.36,1)}
.burger i:nth-child(1){top:17px}.burger i:nth-child(2){top:25px}
body.mopen .burger i:nth-child(1){top:21px;transform:rotate(45deg)}body.mopen .burger i:nth-child(2){top:21px;transform:rotate(-45deg)}
.burger.light{border-color:rgba(0,0,0,.15);background:#fff}.burger.light i{background:#111}body.mopen .burger.light{background:rgba(12,12,18,.7);border-color:rgba(255,255,255,.18)}body.mopen .burger.light i{background:#fff}
.mmenu{position:fixed;inset:0;z-index:90;background:radial-gradient(80% 60% at 100% 0%,rgba(34,81,255,.45),transparent 60%),#050507;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:90px 8vw 40px;
  clip-path:circle(0px at calc(100% - 40px) 40px);visibility:hidden;transition:clip-path .7s cubic-bezier(.22,1,.36,1),visibility .7s}
body.mopen .mmenu{clip-path:circle(150% at calc(100% - 40px) 40px);visibility:visible}
body.mopen{overflow:hidden}
.mmenu nav{display:flex;flex-direction:column}
.mmenu nav a{display:flex;align-items:baseline;gap:14px;font:400 clamp(44px,12vw,72px)/1.02 "Bebas Neue",sans-serif;letter-spacing:.01em;color:#fff;text-decoration:none;opacity:0;translate:0 30px;transition:opacity .5s,translate .6s cubic-bezier(.22,1,.36,1),color .3s}
.mmenu nav a small{font:700 11px/1 "Montserrat",sans-serif;letter-spacing:.2em;color:#7f9bff}
.mmenu nav a:hover,.mmenu nav a:active{color:#2251ff}
body.mopen .mmenu nav a{opacity:1;translate:0 0}
.mmenu .soc{display:flex;gap:8px;flex-wrap:wrap;opacity:0;transition:opacity .5s .45s}
body.mopen .mmenu .soc{opacity:1}
.mmenu .soc a{padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;font:700 13px/1 "Montserrat",sans-serif}
.mmenu .soc a.wa{background:#2251ff;border-color:#2251ff}
.mclose{position:absolute;top:18px;right:5vw;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;transition:background .3s,rotate .4s}
.mclose:hover{background:#fff;color:#111;rotate:90deg}
@media (max-width:820px){.burger{display:block}}
@media (prefers-reduced-motion:reduce){.mmenu,.mmenu nav a,.burger i{transition:none}}
</style>

<script>
(()=>{const m=document.getElementById("mmenu"),b=document.querySelector(".burger");if(!b)return;
  document.querySelectorAll(".mmenu nav a").forEach((a,i)=>a.style.transitionDelay=(.08+i*.05)+"s");
  const set=o=>{document.body.classList.toggle("mopen",o);b.setAttribute("aria-expanded",o);m.setAttribute("aria-hidden",!o);b.setAttribute("aria-label",o?"Close menu":"Open menu");};
  b.addEventListener("click",()=>set(!document.body.classList.contains("mopen")));
  m.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>set(false)));m.querySelector(".mclose").addEventListener("click",()=>{set(false);b.focus();});
  addEventListener("keydown",e=>{if(e.key==="Escape")set(false);});})();
</script>
